server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore/edgesync.p12
    key-store-password: ${EDGE_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12

fetch:
  cron: "0 */15 * * * *" # Pre-fetch ogni 15 minuti
  patient-cohort: "UnitA"
  observation-window-days: 3
  resource-types:
    - Patient
    - AllergyIntolerance
    - MedicationRequest
    - Observation
    - Condition
    - Encounter
    - Immunization
    - Procedure

fhir:
  base-url: "http://localhost:8080/fhir"
  auth-type: "none"
  timeout-ms: 30000
  connect-timeout-ms: 10000

repository:
  storage-path: "./data/ehr-syncsafe"
  encryption-key-path: "./data/ehr-syncsafe.key"
  max-size-mb: 1024

spring:
  datasource:
    url: jdbc:h2:file:./data/ehr-crawler;DB_CLOSE_ON_EXIT=FALSE;CIPEHR=AES;DB_CLOSE_DELAY=1
    username: sa
    password: filepwd password
    driver-class-name: org.h2.Driver